default: claude

providers:
  - name: claude
    protocol: anthropic
    model: claude-sonnet-5
    base_url: https://api.anthropic.com
    api_key: sk-REPLACE-ME
    thinking: true

  - name: gpt
    protocol: openai
    model: gpt-5
    base_url: https://api.openai.com/v1
    api_key: sk-REPLACE-ME

# MCP servers, declared as a map keyed by server name. This file is the
# project layer; ~/.aethercode/aethercode.yaml is the user layer and every
# key there is replaced wholesale by a same-name entry here. A "command"
# entry is a stdio subprocess, a "url" entry a Streamable HTTP endpoint;
# ${VAR} in env and header values expands at load.
# mcp_servers:
#   context7:
#     url: https://mcp.context7.com/mcp
#     headers:
#       Authorization: "Bearer ${CONTEXT7_TOKEN}"
#   playwright:
#     command: npx
#     args: ["@playwright/mcp@latest"]
#     env:
#       DEBUG: "pw:api"
#   # disabled: true drops a server, e.g. one inherited from the user layer.
