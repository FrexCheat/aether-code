# AetherCode configuration example.
# Copy this file to `aethercode.yaml` in the directory where you run AetherCode
# and replace the placeholder API keys.

# Name of the provider entry to use on startup. Must match one of providers[].name.
default: claude

providers:
  - name: claude
    protocol: anthropic
    model: claude-sonnet-5
    base_url: https://api.anthropic.com
    api_key: sk-REPLACE-ME
    thinking: true

  - name: gpt
    protocol: openai
    model: gpt-5
    base_url: https://api.openai.com/v1
    api_key: sk-REPLACE-ME